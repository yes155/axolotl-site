name: Apply ChatGPT Patch and Build

on:
  push:
    branches:
      - chatgpt-work
    paths:
      - '.github/chatgpt-patch.json'

permissions:
  contents: write

concurrency:
  group: myaxolotl-chatgpt-patch
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip patch]') }}
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-work
          fetch-depth: 0

      - name: Apply exact text replacements
        shell: powershell
        run: |
          $specPath = Join-Path $env:GITHUB_WORKSPACE '.github/chatgpt-patch.json'
          if (-not (Test-Path -LiteralPath $specPath)) {
            throw "Patch specification not found: $specPath"
          }

          $spec = Get-Content -LiteralPath $specPath -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $spec.operations -or $spec.operations.Count -lt 1) {
            throw "Patch specification contains no operations."
          }

          foreach ($op in $spec.operations) {
            if ($op.type -ne 'replace') {
              throw "Unsupported patch operation type: $($op.type)"
            }

            $target = Join-Path $env:GITHUB_WORKSPACE $op.path
            if (-not (Test-Path -LiteralPath $target)) {
              throw "Patch target not found: $($op.path)"
            }

            $text = [IO.File]::ReadAllText($target)
            $newline = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }
            $old = ([string]$op.old).Replace("`n", $newline)
            $new = ([string]$op.new).Replace("`n", $newline)
            $matches = ([regex]::Matches($text, [regex]::Escape($old))).Count

            if ($matches -ne 1) {
              throw "Expected exactly one match in $($op.path), found $matches."
            }

            $updated = $text.Replace($old, $new)
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [IO.File]::WriteAllText($target, $updated, $utf8NoBom)
            Write-Host "Patched $($op.path)"
          }

          Remove-Item -LiteralPath $specPath -Force

      - name: Verify external DOCX source
        shell: powershell
        run: |
          if (-not $env:AXOLOTL_SOURCE_DIR) {
            throw "AXOLOTL_SOURCE_DIR is not set on the self-hosted runner."
          }
          if (-not (Test-Path -LiteralPath $env:AXOLOTL_SOURCE_DIR)) {
            throw "AXOLOTL_SOURCE_DIR does not exist: $env:AXOLOTL_SOURCE_DIR"
          }
          Write-Host "Using DOCX source: $env:AXOLOTL_SOURCE_DIR"

      - name: Map external DOCX source to expected build path
        shell: powershell
        run: |
          $expected = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) "axolotls"
          if (Test-Path -LiteralPath $expected) {
            $item = Get-Item -LiteralPath $expected -Force
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) {
              cmd /c rmdir "${expected}"
              if ($LASTEXITCODE -ne 0) { throw "Failed to remove previous DOCX source junction." }
            } else {
              throw "Expected source path already exists and is not a junction: $expected"
            }
          }
          cmd /c mklink /J "${expected}" "${env:AXOLOTL_SOURCE_DIR}"
          if ($LASTEXITCODE -ne 0) { throw "Failed to create DOCX source junction." }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        shell: powershell
        run: python build/build.py

      - name: Show generated diff
        shell: powershell
        run: |
          git status --short
          git diff --stat

      - name: Commit patch and generated output
        shell: powershell
        run: |
          $changes = git status --porcelain
          if (-not $changes) {
            Write-Host "No changes to commit."
            exit 0
          }
          git config user.name "MyAxolotl Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply ChatGPT patch and rebuild [skip patch] [skip build]"
          git push origin HEAD:chatgpt-work
